name: count-candidates
on:
  push:
    branches: [claude/count-candidates]
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/count-candidates.mjs

name: Regenerate demo media
on:
  push:
    branches: [codex/improve-demo-quality]
    paths: [.github/workflows/demo-media.yml]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Optimize poster and extract review frames
        run: |
          ffmpeg -v error -y -i public/demo-poster.png -c:v libwebp -quality 92 -compression_level 6 public/demo-poster.webp
          mkdir -p docs/demo-review dist/demo-review
          ffmpeg -v error -i public/demo.mp4 -vf "fps=1/3,scale=660:-2,tile=2x2" -frames:v 1 dist/demo-review/site.jpg
          ffmpeg -v error -i docs/extension-demo.mp4 -vf "fps=1/4,scale=660:-2,tile=2x2" -frames:v 1 dist/demo-review/extension.jpg
          base64 -w 0 dist/demo-review/site.jpg > docs/demo-review/site.jpg.base64
          base64 -w 0 dist/demo-review/extension.jpg > docs/demo-review/extension.jpg.base64
          ls -lh public/demo-poster.*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/demo-poster.webp docs/demo-review
          git rm public/demo-poster.png public/demo-poster.jpg
          git commit -m "Optimize Retina poster and prepare visual review"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Verify smooth demo motion
on:
  push:
    branches: [codex/smooth-demo-motion]
    paths:
      - scripts/verify-demo-motion.mjs
      - .github/workflows/verify-demo-media.yml
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: demo-media-review
          run-id: 38171626918
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .demo-review
      - name: Check visible motion in decoded frames
        run: |
          mkdir -p dist
          cp .demo-review/dist/*-demo-motion.json dist/
          node scripts/verify-demo-motion.mjs

name: Verify mobile URL focus
on:
  push:
    branches: [codex/mobile-url-keyboard]
    paths:
      - public/**
      - test/**
      - .github/workflows/keyboard-regression.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
